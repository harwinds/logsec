baseURL: "https://www.logsec.cloud"
title: logsec
paginate: 6
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
    disableXML: true
    minifyOutput: true

params:
    env: production # to enable google analytics, opengraph, twitter-cards and schema.
    title: logsec
    description: "Thoughts and ramblings about cybersecurity in a cloudy world."
    keywords: [logsec, cybersecurity, cloud security, aws, splunk, elastic, detection engineering]
    author: Harwinder Sandhu
    defaultTheme: auto # dark, light
    disableThemeToggle: false
    ShowReadingTime: true
    ShowShareButtons: true
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    disableSpecial1stPost: true
    disableScrollToTop: false
    comments: true
    hidemeta: false
    hideSummary: false
    showtoc: false
    tocopen: false

    assets:
        # disableHLJS: true # to disable highlight.js
        # disableFingerprinting: true
        favicon: "/favicon.svg"
        favicon16x16: "/favicon.svg"
        favicon32x32: "/favicon.svg"
        safari_pinned_tab: "/favicon.svg"

    label:
        text: "logsec"
        # icon: /apple-touch-icon.png
        iconHeight: 35

    # profile-mode
    profileMode:
        enabled: false # needs to be explicitly set
        title: logsec
        subtitle: "Thoughts and ramblings about cybersecurity in a cloudy world."
        # imageUrl: "<img location>"
        imageWidth: 120
        imageHeight: 120
        imageTitle: my image
        buttons:
            - name: Posts
              url: posts
            - name: Tags
              url: tags

    # home-info mode (intro box at the top of the homepage), turned off
    # homeInfoParams:
    #     Title: "Hi there \U0001F44B"
    #     Content: I'm Harwinder Sandhu, a cybersecurity consultant. Purpose of this site is to organize everything I have learned and want to learn in this field, and share those things with others. I welcome you to EXPLORE, and I hope you find something here worth your time.

    socialIcons:
        - name: linkedin
          url: "https://www.linkedin.com/in/harwinder-sandhu/"
        - name: github
          url: "https://github.com/harwinds"

    cover:
        hidden: false # hide everywhere but not in structured data
        hiddenInList: true # hide on list pages and home
        hiddenInSingle: true # hide on single page

    # editPost:
    #     URL: "https://github.com/<path_to_repo>/content"
    #     Text: "Suggest Changes" # edit text
    #     appendFilePath: true # to append file path to Edit link

    # for search
    # https://fusejs.io/api/options.html
    fuseOpts:
        isCaseSensitive: false
        shouldSort: true
        location: 0
        distance: 1000
        threshold: 0.4
        minMatchCharLength: 0
        keys: ["title", "permalink", "summary", "content"]
menu:
    main:
        - identifier: posts
          name: posts
          url: /
          weight: 10
        - identifier: about
          name: about
          url: /pages/about
          weight: 20
        - identifier: tags
          name: tags
          url: /tags/
          weight: 25
        - identifier: search
          name: search
          url: /search/
          weight: 30
outputs:
    home:
        - HTML
        - RSS
        - JSON
